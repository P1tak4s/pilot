<!doctype html><body style="margin:0;background:#1f1e1d;color:#aaa;font:11px sans-serif">
<div id=o style="display:flex;flex-wrap:wrap;gap:6px;padding:4px"></div><script>
// Contact sheet: ?s=scene1,scene2&t=0.5,1,2 shows each scene frozen at each time, small.
const q=new URLSearchParams(location.search), ts=(q.get('t')||'0.5,1.5,3,5').split(',').map(Number), w=+(q.get('w')||190);
(async()=>{for(const n of q.get('s').split(',')){const t=await (await fetch('../plugin/hooks/scenes/'+n+'.svg?'+Date.now())).text();
for(const x of ts){const d=document.createElement('div');d.innerHTML=`<div>${n.split('/').pop()} ${x}s</div>`+t;const s=d.querySelector('svg');
s.setAttribute('width',w);s.setAttribute('height',Math.round(w*s.viewBox.baseVal.height/s.viewBox.baseVal.width));s.style.outline='1px solid #333';o.append(d);s.pauseAnimations();s.setCurrentTime(x)}}})()
</script>
