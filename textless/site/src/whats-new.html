<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's new · textless</title>
<meta name="description" content="What changed in each release of textless, the Claude Code mod.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1614">
<link rel="icon" href="__ICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
__STYLE__
<style>
/* What's new: a plain list, newest first, from plugin/public.json. Each release is a bar like the update card in the
   chat: the warm dark band, orange pixels thickening to the right, the mark, the version, the note and the date. The
   newest version is orange. */
.wn{max-width:820px;padding-top:56px;padding-bottom:96px}
.wn h1{margin:0;font:500 clamp(40px,6vw,72px)/1 var(--display);letter-spacing:-.03em;color:var(--paper)}
.rel{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:10px}
.rel li{position:relative;overflow:hidden;display:grid;grid-template-columns:20px 4.6em minmax(0,1fr) auto;align-items:center;column-gap:14px;row-gap:8px;min-height:52px;padding:10px 16px 10px 14px;border-radius:10px;background:#1a1614;border:1px solid #3a2a23;color:var(--body);font-size:15px;line-height:1.4}
.rel li:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 45%,#d9775714 70%,#d977572e),radial-gradient(#d9775760 .8px,transparent 1px) 0 0/6px 6px;-webkit-mask-image:linear-gradient(90deg,transparent 45%,#000 85%);mask-image:linear-gradient(90deg,transparent 45%,#000 85%);image-rendering:pixelated}
.rel li>*{position:relative}
.rel .mark{width:20px;height:20px;color:#8a7f78}
.rel li:first-child .mark{color:var(--orange)}
.rel .v{font-weight:650;font-variant-numeric:tabular-nums;color:var(--paper)}
.rel li:first-child .v{color:var(--orange)}
.rel .n{min-width:0}
.rel .d{grid-column:3 / -1;display:grid;gap:6px;margin:0 0 4px;color:var(--mute);font-size:14px;line-height:1.5}
.rel .d p{position:relative;margin:0;padding-left:16px}
.rel .d p:before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;background:#8a5a46}
.rel time{color:var(--dim);font-size:13.5px;font-variant-numeric:tabular-nums}
.more{margin-top:6px}
.more summary{cursor:pointer;color:var(--mute);font-size:14px}
.more summary:hover{color:var(--paper)}
.more .rel{margin-top:10px}
@media (max-width:560px){.rel li{grid-template-columns:20px minmax(0,1fr) auto;row-gap:6px}.rel .v{grid-column:2;grid-row:1}.rel .n{grid-column:1 / -1;padding-left:34px}.rel time{grid-column:3;grid-row:1}.rel .d{grid-column:1 / -1;padding-left:34px}}
@media (pointer:coarse){.more summary{padding:11px 0}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../">__LOGO__textless</a>
  <nav aria-label="Site"><a class="n" href="../market/">Marketplace</a><a class="get" href="../#install">Get textless</a></nav>
</header>
<main class="wn">
  <h1>What's new</h1>
  __WHATSNEW__
</main>
</body>
</html>
